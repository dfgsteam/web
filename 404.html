<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden | Julius Hunold</title>
    <link rel="stylesheet" href="css/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="images/favicon.ico">
</head>
<body>
    <div class="bubbles-container">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
    </div>

    <div class="window" style="max-width: 600px; height: auto; min-height: 400px; text-align: center; justify-content: center; padding: 40px;">
        <div class="titlebar" style="position: absolute; top: 0; left: 0; width: 100%;">
            <div class="traffic-lights">
                <div class="traffic-light close" onclick="window.location.href='index.html'"></div>
                <div class="traffic-light minimize" onclick="window.location.href='index.html'"></div>
                <div class="traffic-light maximize" onclick="window.location.href='index.html'"></div>
            </div>
            <div class="window-title">Fehler 404</div>
        </div>
        
        <div style="margin-top: 40px;">
            <i class="fas fa-exclamation-triangle" style="font-size: 64px; color: var(--accent); margin-bottom: 20px;"></i>
            <h1 style="font-size: 32px; margin-bottom: 10px;">Seite nicht gefunden</h1>
            <p class="lang-de" style="color: var(--text-secondary); margin-bottom: 30px;">
                Die von Ihnen gesuchte Seite existiert leider nicht oder wurde verschoben.
            </p>
            <p class="lang-en" style="color: var(--text-secondary); margin-bottom: 30px;">
                The page you are looking for does not exist or has been moved.
            </p>
            <a href="index.html" class="sidebar-nav a active" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none;">
                <span class="lang-de">Zur Startseite</span>
                <span class="lang-en">Back to Home</span>
            </a>
        </div>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
